[package]
name = "p2p"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "p2p"
path = "src/main.rs"

[dependencies]
mistlib = { package = "mistlib-native", path = "vendor/mistlib/mistlib-native" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
hex = "0.4"
anyhow = "1"
ratatui = "0.29"
base64 = "0.22"
axum = { version = "0.8", features = ["ws"] }

[dev-dependencies]
temp-env = "0.3"
tokio = { version = "1", features = ["test-util"] }
